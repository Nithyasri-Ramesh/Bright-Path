<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightPath - AI Vision Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="icon">🌟</span>
                <h1>BrightPath</h1>
            </div>
            <p class="subtitle">AI Vision Assistant for the Visually Impaired</p>
        </header>

        <!-- Main Card -->
        <div class="card">
            <!-- Image Preview -->
            <div class="image-preview" id="imagePreview">
                <div class="placeholder">
                    <span class="camera-icon">📷</span>
                    <p>Take or upload a photo to get started</p>
                </div>
                <img id="previewImage" style="display: none;" alt="Uploaded image">
            </div>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="btn btn-primary" id="cameraBtn">
                    <span>📸</span> Take Photo
                </button>
                <button class="btn btn-secondary" id="uploadBtn">
                    <span>📁</span> Upload
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <!-- Analysis Status -->
            <div id="status" class="status hidden">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>

            <!-- Description Display -->
            <div class="description-container" id="descriptionContainer" style="display: none;">
                <div class="description-header">
                    <h3>📝 Description</h3>
                    <button class="btn-text" id="speakBtn">
                        🔊 Listen
                    </button>
                </div>
                <div class="description-content" id="descriptionText">
                    <!-- AI description will appear here -->
                </div>
            </div>

            <!-- Error Display -->
            <div class="error-container" id="errorContainer" style="display: none;">
                <p class="error-text" id="errorText"></p>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Made with ❤️ for the visually impaired community</p>
            <p class="tech">Powered by Gemini AI & Web Speech API</p>
        </footer>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
